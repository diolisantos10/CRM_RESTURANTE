# ─────────────────────────────────────────────────────────────────────────────
# PRÉ-VOO DO MODELO — a conferência que NÃO gasta contato.
#
# Em 08/09/2026 seis contatos de uma lista de 4.000 foram queimados para
# descobrir o que esta consulta responde de graça. A peça que evita gasto não
# pode ser testável só gastando.
#
# Só leitura contra a Graph. Não monta fila, não fala com ninguém.
# ─────────────────────────────────────────────────────────────────────────────

name: Prospecção — pré-voo do modelo (só leitura)

on:
  workflow_dispatch:

jobs:
  pre-voo:
    name: "Conferir o modelo de abordagem"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Montar a URL
        id: params
        run: |
          BASE_URL="${{ secrets.FOOCCI_BASE_URL }}"
          BASE_URL="${BASE_URL%/}"
          if [[ -z "$BASE_URL" ]]; then echo "::error::FOOCCI_BASE_URL não configurado"; exit 1; fi
          echo "url=${BASE_URL}/api/cron/prospeccao/pre-voo" >> "$GITHUB_OUTPUT"

      - name: "POST pré-voo"
        env:
          ENDPOINT_URL: ${{ steps.params.outputs.url }}
          CRON_SECRET:  ${{ secrets.CRON_SECRET }}
        run: |
          curl --connect-timeout 20 --max-time 120 -sS -X POST "$ENDPOINT_URL" \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" \
            -d '{}' -o /tmp/r.json -w "%{http_code}" > /tmp/code.txt || true

          HTTP=$(cat /tmp/code.txt)
          echo "← HTTP        : $HTTP"
          echo "← modelo      : $(jq -rc '.data.modeloConfigurado // "-"' /tmp/r.json)"
          echo "← canal pronto: $(jq -r  '.data.canalPronto      // "-"' /tmp/r.json)"
          echo "← veredito    : $(jq -rc '.data.conferencia      // "-"' /tmp/r.json)"

          # ⭐ O RAIO-X (desde 10/09/2026): os modelos com o corpo, os interruptores
          # e a fila contada. É o que responde "o que impede envio real hoje?"
          # sem painel da Meta nem banco — e sem gastar contato.
          echo "← interruptores: $(jq -rc '.data.interruptores // "-"' /tmp/r.json)"
          echo "← fila         : $(jq -rc '.data.fila          // "-"' /tmp/r.json)"
          echo "← modelos da conta:"
          jq -r '.data.modelos as $m
                 | if ($m | type) == "array"
                   then $m[] | "  · \(.nome) · \(.status) · \(.idioma) · \(.variaveis) variável(is) · \(.corpo | gsub("\n"; " ⏎ "))"
                   else "  (erro: \($m.erro))" end' /tmp/r.json 2>/dev/null \
            || echo "  (lista indisponível)"

          if [[ "$HTTP" -lt 200 || "$HTTP" -ge 300 ]]; then
            echo "::error::o pré-voo não rodou (HTTP $HTTP)"; cat /tmp/r.json; exit 1
          fi

          # ⚠️ Reprova quando o modelo NÃO está pronto. Um pré-voo verde com
          # veredito ruim seria o mesmo alarme mudo que esta obra passou o dia
          # inteiro consertando.
          if [[ "$(jq -r '.data.conferencia.pronto' /tmp/r.json)" != "true" ]]; then
            echo "::error::o modelo de abordagem NÃO está pronto — $(jq -rc '.data.conferencia' /tmp/r.json)"
            exit 1
          fi

          echo "✅ modelo conferido e pronto"
